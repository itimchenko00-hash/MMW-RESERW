<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMW-COMPANY · Заказ</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand">MMW</div><div><small>MMW-COMPANY</small><h1>Развитие проектов от возможности до результата</h1></div></header><section class="intro"><span>КАТАЛОГ → КОНФИГУРАЦИЯ → ЗАЯВКА</span><p>Выберите необходимый состав работ. Итоговая стоимость позиций с пометкой «от» подтверждается после проверки исходных данных.</p></section><div id="catalog"></div><section class="cart"><h2>Ваша конфигурация</h2><div id="cart"></div><div class="total" id="total">0 ₴</div></section><section class="form"><h2>Оформление заявки</h2><form id="order"><input name="customerName" placeholder="Имя" required><input name="phone" placeholder="Телефон" required><input name="email" type="email" placeholder="Email" required><input name="company" placeholder="Компания"><input name="projectType" placeholder="Проект / направление" required><input name="address" placeholder="Площадка / адрес" required><textarea name="comment" placeholder="Задача и исходные данные" required></textarea><button>Отправить заявку</button></form><div id="result"></div></section><section class="journal"><h2>Проверка заявки</h2><form id="access"><input name="phone" placeholder="Телефон" required><input name="code" inputmode="numeric" maxlength="5" placeholder="5-значный код" required><button>Открыть</button></form><div id="lookup"></div></section></main><script src="/app.js"></script></body></html>
