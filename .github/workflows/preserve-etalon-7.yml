name: Preserve Etalon 7.0 snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reserve repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact Etalon 7.0 source
        uses: actions/checkout@v4
        with:
          repository: itimchenko00-hash/MMW-ORDER-FACTORY
          ref: cfe186bc9fdfb4584e11c51800ba06c7249cd163
          path: factory-source
          fetch-depth: 1

      - name: Copy exact Etalon 7.0 workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "ETALON-7.0"
          mkdir -p "ETALON-7.0"
          cp -a "factory-source/MMW-COMPANY/2 — WORKING" "ETALON-7.0/MMW-COMPANY-2-WORKING"
          rm -rf factory-source

      - name: Commit immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW Etalon Reserve"
          git config user.email "itimchenko00@gmail.com"
          git add -A "ETALON-7.0"
          git commit -m "Preserve MMW-COMPANY Etalon 7.0 exact snapshot"
          git push origin HEAD:main

      - name: Remove one-time snapshot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/preserve-etalon-7.yml"
          git add -A ".github/workflows/preserve-etalon-7.yml"
          git commit -m "Remove one-time Etalon snapshot workflow"
          git push origin HEAD:main
